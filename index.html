<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracé — éditeur de parcours et de flowcharts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&display=swap">
<!-- Bibliothèques CDN pour Export PNG & PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#EEF0EA;--dot:#BFC6BA;--ink:#1D2A2E;--panel:#FFFFFF;--line:#2B3A3F;--acc:#1F6F78;--sh:#1D2A2E;--mut:#5E6B6E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C1E;--dot:#2E393D;--ink:#E6ECEA;--panel:#222B2E;--line:#9FB1B5;--acc:#5CC1CC;--sh:#05080A;--mut:#8A9A9E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161C1E;--dot:#2E393D;--ink:#E6ECEA;--panel:#222B2E;--line:#9FB1B5;--acc:#5CC1CC;--sh:#05080A;--mut:#8A9A9E;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font:400 14px/1.35 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#stage{position:absolute;inset:0;touch-action:none;overflow:hidden;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.7px);background-size:24px 24px;cursor:default}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.e{fill:none;stroke:var(--line);stroke-width:2;pointer-events:none}
.e.on{stroke:var(--acc);stroke-width:3.5}
.hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
#nodes{position:absolute;left:0;top:0}
.node{position:absolute;min-height:56px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;text-align:center;color:#1D2A2E;cursor:grab;user-select:none;-webkit-user-select:none;z-index:1}
.node.sel{z-index:10}
.node .bg{position:absolute;inset:0;border-radius:10px;background:var(--panel);box-shadow:0 0 0 1.5px #1D2A2E,4px 4px 0 var(--sh);z-index:-1}
.node.p .bg{border-radius:999px}
.node.d{min-height:104px;padding:20px 36px}
.node.d::before{content:"";position:absolute;inset:-3px;background:#1D2A2E;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);z-index:-2}
.node.d .bg{border-radius:0;box-shadow:none;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.node.sel .bg{outline:3px solid var(--acc);outline-offset:3px}
.node.d.sel .bg{outline:0}.node.d.sel::before{background:var(--acc);inset:-5px}
.node-ico{font-size:16px;position:relative;z-index:1}
.t{position:relative;z-index:1;outline:0;min-width:20px;word-break:break-word}
.t[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text;background:rgba(255,255,255,.85);border-radius:4px;padding:2px 4px}
.h{position:absolute;z-index:5;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);opacity:0;cursor:crosshair;transition:opacity .12s}
.h::after{content:"";position:absolute;inset:-11px}
.h[data-s=t]{left:50%;top:-6px;margin-left:-6px}.h[data-s=b]{left:50%;bottom:-6px;margin-left:-6px}
.h[data-s=l]{top:50%;left:-6px;margin-top:-6px}.h[data-s=r]{top:50%;right:-6px;margin-top:-6px}
.node:hover .h,.node.sel .h{opacity:1}
.bar{position:absolute;z-index:50;display:flex;gap:4px;align-items:center;background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;padding:5px;box-shadow:3px 3px 0 var(--sh);max-width:calc(100% - 20px);overflow-x:auto;white-space:nowrap;box-sizing:border-box}
#top{top:calc(10px + env(safe-area-inset-top,0px));left:10px}
#bot{bottom:14px;left:50%;transform:translateX(-50%)}
.brand{font-weight:600;font-size:16px;padding:0 8px 0 6px;letter-spacing:-.01em}
button{font:inherit;color:var(--ink);background:transparent;border:0;border-radius:8px;padding:8px 10px;min-height:36px;cursor:pointer;white-space:nowrap}
button:hover{background:rgba(127,140,140,.18)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.sep{width:1px;align-self:stretch;background:var(--mut);opacity:.4;margin:4px 2px}
#sw{display:flex;gap:5px;padding:0 4px}
#sw i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);cursor:pointer;box-sizing:border-box}
#sw i.on{outline:2px solid var(--acc);outline-offset:2px}
#zl{color:var(--mut);margin-left:4px}
#hint{position:absolute;left:12px;bottom:calc(14px + 4px);color:var(--mut);font-size:12px;max-width:230px;z-index:4}
@media(max-width:900px){#hint{display:none}}

/* Mini-map */
#minimap{position:absolute;right:14px;bottom:14px;width:160px;height:110px;background:var(--panel);border:1.5px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--sh);z-index:40;overflow:hidden;pointer-events:none}
#minimap canvas{width:100%;height:100%;display:block}

/* Modale globale & Recherche */
#dlg,#search-dlg{position:absolute;inset:0;z-index:100;background:rgba(10,16,18,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#dlg[hidden],#search-dlg[hidden]{display:none}
#dlg div,#search-dlg div{background:var(--panel);border:1.5px solid var(--ink);border-radius:14px;padding:16px;width:min(560px,100%);box-shadow:4px 4px 0 var(--sh)}
#dlg p,#search-dlg p{margin:0 0 10px;color:var(--mut)}
textarea{width:100%;height:240px;box-sizing:border-box;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1.5px solid var(--ink);border-radius:8px;padding:8px;resize:vertical}
input[type="text"]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--ink);border-radius:8px;padding:8px;margin-bottom:8px}
.search-results{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.search-item{padding:8px;border-radius:6px;cursor:pointer;background:rgba(127,140,140,.08);display:flex;justify-content:space-between}
.search-item:hover{background:rgba(31,111,120,.15)}
#dlg .row,#search-dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;align-items:center}
#msg{margin-right:auto;color:var(--mut);font-size:13px}
.pri{background:var(--acc);color:#fff}.pri:hover{background:var(--acc);filter:brightness(1.1)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="world"><svg id="edges"></svg><div id="nodes"></div></div></div>
<div id="minimap"><canvas id="m-canvas" width="160" height="110"></canvas></div>

<div class="bar" id="top">
  <b class="brand">Tracé</b>
  <button data-a="undo" data-i18n="undo">Annuler</button>
  <button data-a="search" data-i18n="searchBtn">🔍 Rechercher</button>
  <button data-a="tpl" data-i18n="tpl">Modèle</button>
  <button data-a="data" data-i18n="data">Données</button>
  <button data-a="clear" data-i18n="clear">Effacer</button>
  <span class="sep"></span>
  <button data-a="export-png">PNG</button>
  <button data-a="export-pdf">PDF</button>
  <span class="sep"></span>
  <button data-a="lang">🌐 <span id="lang-lbl">EN</span></button>
</div>

<div class="bar" id="bot">
  <button data-a="add-r" data-i18n="addStep">Étape</button>
  <button data-a="add-p" data-i18n="addStart">Début / fin</button>
  <button data-a="add-d" data-i18n="addDecision">Décision</button>
  <span class="sep"></span>
  <button data-a="icon" data-i18n="iconBtn">⭐ Icône</button>
  <span class="sep"></span><span id="sw"></span><span class="sep"></span>
  <button data-a="edit" data-i18n="edit">Texte</button>
  <button data-a="del" data-i18n="del">Supprimer</button>
  <button data-a="fit"><span data-i18n="center">Centrer</span> <span id="zl">100%</span></button>
</div>
<div id="hint" data-i18n="hint">Double-clic : ajouter ou modifier. Tirez un point de bord pour relier ; relâchez dans le vide pour créer l’étape suivante.</div>

<!-- Modale JSON -->
<div id="dlg" hidden><div>
  <p data-i18n="jsonDesc">Copiez ce JSON pour sauvegarder votre schéma, ou collez-en un pour le charger.</p>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="row"><span id="msg"></span><button data-a="close" data-i18n="close">Fermer</button><button class="pri" data-a="load" data-i18n="load">Charger ce JSON</button></div>
</div></div>

<!-- Modale Recherche -->
<div id="search-dlg" hidden><div>
  <p data-i18n="searchDesc">Rechercher une étape par son texte :</p>
  <input type="text" id="search-input" placeholder="Tapez un mot-clé...">
  <div class="search-results" id="search-results"></div>
  <div class="row"><button data-a="close-search" data-i18n="close">Fermer</button></div>
</div></div>

<script>
(()=>{
const i18n = {
  fr: { undo: "Annuler", searchBtn: "🔍 Rechercher", tpl: "Modèle", data: "Données", clear: "Effacer", addStep: "Étape", addStart: "Début / fin", addDecision: "Décision", iconBtn: "⭐ Icône", edit: "Texte", del: "Supprimer", center: "Centrer", hint: "Double-clic : ajouter ou modifier. Tirez un point de bord pour relier ; relâchez dans le vide.", jsonDesc: "Copiez ce JSON pour sauvegarder votre schéma, ou collez-en un pour le charger.", close: "Fermer", load: "Charger ce JSON", searchDesc: "Rechercher une étape par son texte :" },
  en: { undo: "Undo", searchBtn: "🔍 Search", tpl: "Template", data: "Data", clear: "Clear", addStep: "Step", addStart: "Start / End", addDecision: "Decision", iconBtn: "⭐ Icon", edit: "Text", del: "Delete", center: "Fit", hint: "Double-click: add/edit. Drag edge point to connect; drop on empty space to create step.", jsonDesc: "Copy JSON to save your diagram, or paste one to load it.", close: "Close", load: "Load JSON", searchDesc: "Search a step by text:" }
};
let lang = 'fr';
function setLang(l) {
  lang = l; document.documentElement.setAttribute('data-lang', l);
  $('#lang-lbl').textContent = l === 'fr' ? 'EN' : 'FR';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (i18n[lang][k]) el.textContent = i18n[lang][k];
  });
}

const $=s=>document.querySelector(s);
const st=$('#stage'),nl=$('#nodes'),es=$('#edges'),world=$('#world');
const KEY='trace-v2',COL=['#FFFFFF','#F6D86B','#F28C74','#9AD6B5','#9CC7F0','#C9B6F2'];
const ICONS=['','👤','⚙️','✅','⚠️','⭐','📁','💡','🔒','🚀','💬'];
const DEFS='<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line)"/></marker></defs>';
let S={nodes:[],edges:[],v:{x:0,y:0,k:1}},sel=null,hist=[],nid=1,color='#FFFFFF',els={},tm;

const clamp=(a,b,c)=>Math.max(b,Math.min(c,a));
const fixId=()=>{nid=Math.max(0,...S.nodes.map(n=>n.id),...S.edges.map(e=>e.id))+1};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const snap=()=>{hist.push(JSON.stringify({nodes:S.nodes,edges:S.edges}));if(hist.length>60)hist.shift()};
const node=id=>S.nodes.find(n=>n.id==id);
const bx=n=>({x:n.x,y:n.y,w:els[n.id].offsetWidth,h:els[n.id].offsetHeight});

function addNode(x,y,s='r',t='Nouvelle étape',icon=''){const n={id:nid++,x,y,w:s=='d'?180:160,s,c:color,t,icon};S.nodes.push(n);return n}

function pts(a,b){
  const ax=a.x+a.w/2,ay=a.y+a.h/2,bx_=b.x+b.w/2,by=b.y+b.h/2,dx=bx_-ax,dy=by-ay;
  if(Math.abs(dx)/(a.w+b.w+1)>Math.abs(dy)/(a.h+b.h+1)){const s=Math.sign(dx)||1;return[ax+s*a.w/2,ay,s,0,bx_-s*b.w/2,by,-s,0]}
  const s=Math.sign(dy)||1;return[ax,ay+s*a.h/2,0,s,bx_,by-s*b.h/2,0,-s];
}
function path(p){const c=Math.max(40,Math.hypot(p[4]-p[0],p[5]-p[1])/2.5);
  return `M${p[0]} ${p[1]}C${p[0]+p[2]*c} ${p[1]+p[3]*c} ${p[4]+p[6]*c} ${p[5]+p[7]*c} ${p[4]} ${p[5]}`}

function edges(){
  let h='';
  S.edges.forEach(e=>{const a=node(e.a),b=node(e.b);if(!a||!b||!els[a.id]||!els[b.id])return;
    const d=path(pts(bx(a),bx(b))),on=sel&&sel.t=='e'&&sel.id==e.id;
    h+=`<path class="e${on?' on':''}" d="${d}" marker-end="url(#ar)"/><path class="hit" data-e="${e.id}" d="${d}"/>`});
  es.innerHTML=DEFS+h+'<path id="tmp" class="e" style="display:none" marker-end="url(#ar)"/>';
  drawMinimap();
}
function render(){
  nl.innerHTML='';els={};
  S.nodes.forEach(n=>{
    const d=document.createElement('div');
    d.className='node '+n.s+(sel&&sel.t=='n'&&sel.id==n.id?' sel':'');
    d.dataset.id=n.id;d.style.left=n.x+'px';d.style.top=n.y+'px';d.style.width=n.w+'px';
    let inner='<div class="bg"></div>';
    if(n.icon) inner+=`<span class="node-ico">${n.icon}</span>`;
    inner+='<div class="t"></div><i class="h" data-s="t"></i><i class="h" data-s="r"></i><i class="h" data-s="b"></i><i class="h" data-s="l"></i>';
    d.innerHTML=inner;
    d.querySelector('.bg').style.background=n.c;d.querySelector('.t').textContent=n.t;
    nl.appendChild(d);els[n.id]=d;
  });
  edges();view();
}
function view(){
  const v=S.v;world.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.k})`;
  const g=24*v.k;st.style.backgroundSize=g+'px '+g+'px';st.style.backgroundPosition=(v.x-g/2)+'px '+(v.y-g/2)+'px';
  $('#zl').textContent=Math.round(v.k*100)+'%';clearTimeout(tm);tm=setTimeout(save,400);
  drawMinimap();
}
function select(t,id){
  sel=t?{t,id}:null;
  for(const i in els)els[i].classList.toggle('sel',!!sel&&sel.t=='n'&&sel.id==i);
  edges();
}
function zoomAt(cx,cy,f){const v=S.v,k=clamp(v.k*f,.2,3),r=k/v.k;v.x=cx-(cx-v.x)*r;v.y=cy-(cy-v.y)*r;v.k=k;view()}
const toW=e=>{const r=st.getBoundingClientRect();return[(e.clientX-r.left-S.v.x)/S.v.k,(e.clientY-r.top-S.v.y)/S.v.k]}

function fit(){
  if(!S.nodes.length){S.v={x:st.clientWidth/2,y:st.clientHeight/2,k:1};view();return}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  S.nodes.forEach(n=>{const b=bx(n);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)});
  const W=st.clientWidth,H=st.clientHeight,k=clamp(Math.min(Math.max(W-60,100)/(x1-x0),Math.max(H-200,100)/(y1-y0)),.2,1.2);
  S.v={k,x:(W-(x1-x0)*k)/2-x0*k,y:(H-(y1-y0)*k)/2-y0*k+20};view();
}

/* Mini-map Engine */
function drawMinimap(){
  const canvas=$('#m-canvas');if(!canvas)return;
  const ctx=canvas.getContext('2d'),cw=canvas.width,ch=canvas.height;
  ctx.clearRect(0,0,cw,ch);
  if(!S.nodes.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  S.nodes.forEach(n=>{const b=els[n.id]?{w:els[n.id].offsetWidth,h:els[n.id].offsetHeight}:{w:160,h:56};
    x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+b.w);y1=Math.max(y1,n.y+b.h)});
  const pad=100,dw=x1-x0+pad*2,dh=y1-y0+pad*2;
  const scale=Math.min(cw/dw,ch/dh);
  const ox=-x0+pad,oy=-y0+pad;
  
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--line').trim()||'#2B3A3F';
  S.nodes.forEach(n=>{
    const b=els[n.id]?{w:els[n.id].offsetWidth,h:els[n.id].offsetHeight}:{w:160,h:56};
    ctx.fillRect((n.x+ox)*scale,(n.y+oy)*scale,b.w*scale,b.h*scale);
  });
}

/* Édition & Actions */
function edit(id){
  const el=els[id];if(!el)return;const t=el.querySelector('.t');
  t.contentEditable='true';t.focus();getSelection().selectAllChildren(t);
  const done=()=>{t.contentEditable='false';const v=t.innerText.trim()||'Étape',n=node(id);
    if(n.t!=v){snap();n.t=v}t.textContent=n.t;save();edges();t.removeEventListener('blur',done)};
  t.addEventListener('blur',done);t.oninput=edges;
  t.onkeydown=ev=>{if((ev.key=='Enter'&&!ev.shiftKey)||ev.key=='Escape'){ev.preventDefault();t.blur()}};
}
function del(){
  if(!sel)return;snap();
  if(sel.t=='n'){S.nodes=S.nodes.filter(n=>n.id!=sel.id);S.edges=S.edges.filter(e=>e.a!=sel.id&&e.b!=sel.id)}
  else S.edges=S.edges.filter(e=>e.id!=sel.id);
  sel=null;render();save();
}
function dup(){
  if(!sel||sel.t!='n')return;snap();const o=node(sel.id),n={...o,id:nid++,x:o.x+30,y:o.y+30};
  S.nodes.push(n);sel={t:'n',id:n.id};render();save();
}
function undo(){const h=hist.pop();if(!h)return;const o=JSON.parse(h);S.nodes=o.nodes;S.edges=o.edges;sel=null;fixId();render();save()}
function addCenter(s){
  snap();const v=S.v,j=Math.random()*40-20;
  const n=addNode((st.clientWidth/2-v.x)/v.k-80+j,(st.clientHeight/2-v.y)/v.k-30+j,s,s=='p'?(lang=='fr'?'Début':'Start'):s=='d'?(lang=='fr'?'Condition ?':'Condition ?'):(lang=='fr'?'Nouvelle étape':'New step'));
  sel={t:'n',id:n.id};render();save();
}
function cycleIcon(){
  if(!sel||sel.t!='n')return;snap();const n=node(sel.id);
  const idx=ICONS.indexOf(n.icon||'');
  n.icon=ICONS[(idx+1)%ICONS.length];
  render();save();
}

/* Recherche rapide */
function openSearch(){$('#search-input').value='';$('#search-results').innerHTML='';$('#search-dlg').hidden=false;$('#search-input').focus()}
$('#search-input').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();const res=$('#search-results');res.innerHTML='';
  if(!q)return;
  S.nodes.filter(n=>n.t.toLowerCase().includes(q)).forEach(n=>{
    const d=document.createElement('div');d.className='search-item';
    d.innerHTML=`<span>${n.icon||''} ${n.t}</span><small>(${n.s})</small>`;
    d.onclick=()=>{
      select('n',n.id);$('#search-dlg').hidden=true;
      const b=bx(n);S.v.x=st.clientWidth/2-(b.x+b.w/2)*S.v.k;S.v.y=st.clientHeight/2-(b.y+b.h/2)*S.v.k;view();
    };
    res.appendChild(d);
  });
});

/* Export HD (PNG / PDF) */
function exportDiagram(format) {
  if (!S.nodes.length) return alert("Aucun nœud à exporter.");
  const oldSel=sel;select(null);
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  S.nodes.forEach(n=>{const b=bx(n);minX=Math.min(minX,b.x);minY=Math.min(minY,b.y);maxX=Math.max(maxX,b.x+b.w);maxY=Math.max(maxY,b.y+b.h)});
  const margin=80,w=Math.max(400,maxX-minX+margin*2),h=Math.max(300,maxY-minY+margin*2);
  const z=S.v.k,px=S.v.x,py=S.v.y;
  S.v.k=1;S.v.x=-minX+margin;S.v.y=-minY+margin;view();
  setTimeout(()=>{
    html2canvas(world,{backgroundColor:getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#EEF0EA',useCORS:true,scale:2,x:minX-margin,y:minY-margin,width:w,height:h}).then(canvas=>{
      S.v.k=z;S.v.x=px;S.v.y=py;view();if(oldSel)select(oldSel.t,oldSel.id);
      const link=document.createElement('a');
